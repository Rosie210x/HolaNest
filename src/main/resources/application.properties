spring.application.name=hola-nest
server.port=8080

# Local development values come from .env (git-ignored); see .env.example
spring.config.import=optional:file:.env[.properties]

# MS SQL Server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Vietnamese text must be stored as NVARCHAR on SQL Server
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Reverse proxy support (native behind HTTPS termination)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# JSON / encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Security (NFR05)
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=hola-nest
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
app.security.jwt.refresh-reuse-leeway=10s
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=Strict
# BR03
app.security.login.max-failed-attempts=5
app.security.login.lock-duration=15m
app.security.rate-limit.auth-requests-per-minute=30
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seeded accounts: nothing is created while the password is empty (BR01)
app.seed.admin-email=${APP_ADMIN_EMAIL:}
app.seed.password=${APP_SEED_PASSWORD:}
app.seed.demo-users=${APP_SEED_DEMO_USERS:false}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.withCredentials=true
springdoc.swagger-ui.csrf.enabled=true
