spring.application.name=SE1987_HE190020_Lab03
server.port=8080

# MS SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=customer_management;encrypt=false;trustServerCertificate=true;loginTimeout=30;sendTimeAsDatetime=false
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Session-based REST login for React frontend
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Comma-separated frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JSON / encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.withCredentials=true

#security JWT
security.jwt.secret-key=9a2f8c2e4b1d6e8a0c3f5b7d9e2a4c6f8b0e3d1c5a7f9b2e4d6c8a0b3f5e7d9a
security.jwt.expiration-time=3600000
